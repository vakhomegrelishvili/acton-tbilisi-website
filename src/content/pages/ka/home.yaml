philosophy:
  title: "როგორ სამყაროსთვის ვამზადებთ მოსწავლეს"
  text: "არავინ იცის, რა პროფესიები იქნება საჭირო თხუთმეტ წელიწადში. ამიტომ საბაზისო საგნებს საკუთარი ტემპითა და თანამედროვე ინსტრუმენტებით ვასწავლით, ხოლო დღის მთავარ დროს იმაში ვაბანდებთ, რაც ნებისმიერ სამყაროში ღირებული დარჩება: სწორი მორალური საფუძველი, ღირსეული ბავშვობა უაზრო ტანჯვის გარეშე და საკუთარი ნიჭის გამოვლენა."
  link: "საგანმანათლებლო ფილოსოფია →"
