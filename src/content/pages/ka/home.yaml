fit:
  label: გულწრფელად, ვისთვისაა
  title: ყველასთვის არა.
  accent: შესაძლოა, სწორედ თქვენთვის.
  forYou:
    - გინდათ, რომ ბავშვმა თავად მართოს სწავლა
    - გჯერათ, რომ შეცდომა სწავლის ნაწილია
    - გინდათ იყოთ სკოლის საზოგადოების ნაწილი
  notForYou:
    - მთავარია ნიშნები და რეიტინგი
    - გინდათ, რომ მასწავლებელმა ყველაფერი ახსნას
    - გეშინიათ ბავშვის დამოუკიდებლობის
  quiz:
    title: გაიგე, ეს სკოლა არის თუ არა საშენო!
    intro: ცალკე მშობლებისთვის და ბავშვებისთვის. პასუხებს არსად ვინახავთ.
    # Each question has exactly 3 options: first = most "Acton", last = least.
    verdictLabels:
      yes: [კარგად მოგერგებათ, შენ აქ გეგონება!]
      maybe: [შესაძლოა, შესაძლოა]
      no: [სავარაუდოდ არა, სავარაუდოდ არა]
    audiences:
      - label: მშობლებისთვის
        questions:
          - q: "როცა ბავშვი შეცდომას უშვებს, თქვენ…"
            options:
              - "ვაძლევ საშუალებას, თავად იპოვოს გამოსავალი"
              - "ვეხმარები, მაგრამ მის ნაცვლად არ ვაკეთებ"
              - "ვასწორებ, რომ არ განმეორდეს"
          - q: "რამდენად მნიშვნელოვანია თქვენთვის ნიშნები?"
            options:
              - "არ მჭირდება, მირჩევნია ნამუშევარი ვნახო"
              - "კარგია, მაგრამ მთავარი არ არის"
              - "ძალიან მნიშვნელოვანია"
          - q: "თქვენი ბავშვი თავისუფალ დროს…"
            options:
              - "თავად იგონებს, რა აკეთოს"
              - "ზოგჯერ სჭირდება ბიძგი"
              - "ურჩევნია, ვინმემ უთხრას"
          - q: "მზად ხართ, იყოთ სკოლის საზოგადოების აქტიური წევრი?"
            options:
              - "დიახ, ეს მინდა"
              - "დროდადრო"
              - "ამის დრო არ მაქვს"
        verdicts:
          yes: თქვენ ენდობით ბავშვის დამოუკიდებლობას და შეცდომას სწავლის ნაწილად ხედავთ. ზუსტად ასე მუშაობს ჩვენი სტუდია.
          maybe: ბევრი რამ მოგწონთ, ზოგი რამ გაშფოთებთ. ეს ნორმალურია. გამოსაცდელი პერიოდი საუკეთესო გზაა, რომ ნახოთ.
          no: "გულწრფელად: როგორც ჩანს, უფრო სტრუქტურირებული სკოლა მოგერგებათ. თუ მაინც გაინტერესებთ, სიამოვნებით გესაუბრებით."
      - label: ბავშვებისთვის
        questions:
          - q: "როცა რამე არ გამოგდის, შენ…"
            options:
              - "ვცდი სხვანაირად"
              - "ვთხოვ ვინმეს დახმარებას"
              - "ვანებებ თავს"
          - q: "რომელი უფრო მოგწონს?"
            options:
              - "საკუთარი პროექტის მოფიქრება"
              - "მეგობრებთან ერთად თამაში"
              - "როცა მეუბნებიან, რა გავაკეთო"
          - q: "წესები ვინ უნდა დაწეროს?"
            options:
              - "ჩვენ, ბავშვებმა, ერთად"
              - "ბავშვებმა და უფროსებმა"
              - "მხოლოდ უფროსებმა"
          - q: "რისი გაყიდვა გინდოდა ბაზრობაზე?"
            options:
              - "რამე, რასაც თავად გავაკეთებდი"
              - "ჯერ არ ვიცი"
              - "ბაზრობა არ მაინტერესებს"
        verdicts:
          yes: შენ გიყვარს საკუთარი იდეები და არ გეშინია ცდის. მოდი, გამოსაცდელი პერიოდი ჩვენთან გაატარე.
          maybe: ზოგი რამ მოგეწონება, ზოგი ახალი იქნება. გამოსაცდელი პერიოდი საუკეთესო გზაა, რომ გაიგო.
          no: შეიძლება ახლა სხვა სკოლა გირჩევნია, და ეს ნორმალურია. მაინც შეგიძლია გვესტუმრო.

