      - title: "კვება და ტრანსპორტი ცალკეა"
        text: "12 000 ლარი მხოლოდ სწავლებას მოიცავს. კვება სურვილისამებრ 200 ლარია თვეში, ტრანსპორტი საჭიროებისამებრ 210 ლარი. თუ გვადარებთ სკოლას, რომლის ფასშიც კვება შედის, სამართლიანი შედარებისთვის იმ სკოლის ფასს კვების ღირებულება გამოაკელით ან ჩვენსას დაუმატეთ."
      - title: "გრძელი სასკოლო დღე"
        text: "ჩვენი ძირითადი დღე 09:00–15:30-ია (6,5 საათი). ეს ბევრ სკოლაში საბაზისო გაკვეთილებზე გრძელია და გახანგრძლივებული დღის დამატებით ხარჯს ხშირად საერთოდ ხსნის."
      - title: "ზაფხული და არდადეგები"
        text: "მომუშავე მშობლისთვის ზაფხულის 3 თვე და ხშირი არდადეგები ხშირად ბანაკების, დამატებითი წრეების ან ძიძის ცალკე ბიუჯეტს ნიშნავს. ჩვენ მთელი წელი ვმუშაობთ, ოჯახს კი პირადი დასვენების დაგეგმვა წლის ნებისმიერ დროს შეუძლია."
      - title: "ფინანსური რისკის გარეშე"
        text: "ადგილის დაჯავშნის თანხა არ გვაქვს. გამოსაცდელი 2 კვირა უფასოა, თუ ბავშვი არ დარჩება. შუა წელში წასვლისას ოჯახი მხოლოდ გატარებულ დღეებს იხდის, წინასწარ გადახდილი დარჩენილი თანხა კი პროპორციულად ბრუნდება."
  extras:
